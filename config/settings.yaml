# Central configuration. Paths are relative to the repo root.

db_path: data/carbon.duckdb

# First UTC date to ingest. The end date defaults to yesterday (UTC), the most
# recent complete day; override both on the CLI with --start / --end.
start_date: 2019-01-01

carbon_intensity:
  base_url: https://api.carbonintensity.org.uk
  # The docs state a 14-day maximum for /intensity/{from}/{to}, but the live API
  # accepts up to 31 days and rejects anything longer with HTTP 400 (verified
  # 2026-09-28). /generation/{from}/{to} has no documented limit; we use the
  # same chunk size for both to stay well inside what we have observed working.
  max_days_per_request: 30
  min_interval_s: 0.5

open_meteo:
  archive_url: https://archive-api.open-meteo.com/v1/archive
  hist_forecast_url: https://historical-forecast-api.open-meteo.com/v1/forecast
  prev_runs_url: https://previous-runs-api.open-meteo.com/v1/forecast
  # Previous-runs API: `<var>_previous_dayN` is the value predicted N*24h before
  # the valid time. Pinning one model keeps the series reproducible;
  # ecmwf_ifs025 has complete lead-day 1-3 coverage from 2024-03-09 (verified
  # by probing the API on 2026-09-28).
  prev_runs_model: ecmwf_ifs025
  prev_runs_start_date: 2024-03-09
  prev_runs_lead_days: [1, 2, 3]
  max_days_per_request: 366
  # Open-Meteo's free tier weights long multi-variable requests as several
  # calls against a 600/minute budget; a 3 s gap keeps us far below it.
  min_interval_s: 3.0

features:
  # Forecast origins: every 6 hours. Several origin times per day stop the
  # model from confusing "horizon" with "time of day of the target".
  origin_hours_utc: [0, 6, 12, 18]
  # Direct multi-horizon: every half-hour from 24h to 48h ahead (49 horizons).
  horizon_min_h: 24
  horizon_max_h: 48
  # A half-hour's actual intensity and generation mix are assumed usable only
  # this long after the period ends. On 2026-09-28 the API published actuals
  # within ~20 min; 60 min is a conservative margin. At origin O the newest
  # usable period is the one ending at O - 60 min.
  data_availability_lag_minutes: 60
  # A previous-runs value "predicted N*24h before valid time" is treated as
  # usable only this many hours after that point, to cover model run time and
  # data dissemination. A half-hour's weather uses the next hourly value too,
  # so the lead day is chosen from that later hour: day 2 up to h = 39.5h and
  # day 3 beyond. We never use a forecast that could not have existed at the origin.
  weather_forecast_availability_hours: 8
  # Intensity values above this (no GB fuel emits more; coal is ~900-1,000
  # gCO2/kWh) or exactly zero are treated as data errors and set to null.
  suspect_max_gco2: 1000
  # Simple wind-power proxy at 100 m: 0 below cut-in, cubic to rated, 1 up to
  # cut-out, 0 above (turbines shut down in storms).
  wind_cut_in_ms: 3.0
  wind_rated_ms: 12.0
  wind_cut_out_ms: 25.0

evaluation:
  # Phase 4 backtest: origins from here to the end of the data, retrained monthly.
  test_start: 2025-10-01
  # Tuning validates on the months immediately before test_start and never
  # sees the test period. Training rows are purged so no training target
  # falls at or after the validation start.
  validation_months: 6

model:
  seed: 42
  n_search: 12              # random-search configurations per tuned variant
  max_boost_rounds: 3000
  early_stopping_rounds: 100
  # Feature groups are column-name prefixes in training_set.
  variants:
    no_weather:
      prefixes: [f_]
      train_start: 2019-01-01
    weather_forecast:
      prefixes: [f_, wxf_]
      train_start: 2024-03-09   # previous-runs weather forecasts start here
    # Ablation: no weather, same short history as weather_forecast, to separate
    # the value of weather forecasts from the effect of less training data.
    no_weather_short:
      prefixes: [f_]
      train_start: 2024-03-09
      params_from: no_weather
    # LEAKY upper bound: observed weather at the target time. Not deployable.
    oracle_weather:
      prefixes: [f_, oracle_]
      train_start: 2019-01-01
      params_from: no_weather
      leaky: true

# Weather sites. GB carbon intensity is driven mainly by how much gas is needed
# to fill the gap left by wind and solar, and by demand, so the sites are
# chosen to cover the largest wind and solar fleets plus the main demand centre:
#   * Offshore wind is concentrated in the southern North Sea (Hornsea, Dogger
#     Bank, East Anglia) and the Moray Firth; the two are ~500 km apart and
#     often sit under different weather systems.
#   * Onshore wind is dominated by Scotland; Whitelee is the UK's largest
#     onshore farm and a proxy for the Central Belt / Southern Uplands fleet.
#   * Solar capacity is concentrated in southern England, especially the
#     South West and East Anglia.
#   * London temperature proxies heating/cooling-driven demand.
locations:
  - id: hornsea
    name: Hornsea offshore wind zone
    role: wind
    latitude: 53.885
    longitude: 1.791
  - id: moray_firth
    name: Moray Firth offshore wind (Beatrice / Moray East)
    role: wind
    latitude: 58.250
    longitude: -2.870
  - id: whitelee
    name: Whitelee onshore wind farm
    role: wind
    latitude: 55.680
    longitude: -4.250
  - id: somerset
    name: Somerset / Wiltshire solar cluster
    role: solar
    latitude: 51.200
    longitude: -2.600
  - id: east_anglia
    name: Suffolk / Norfolk solar cluster
    role: solar
    latitude: 52.300
    longitude: 0.900
  - id: london
    name: London demand centre
    role: demand
    latitude: 51.507
    longitude: -0.128
